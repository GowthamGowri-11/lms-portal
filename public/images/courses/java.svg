<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="javaBgGlow" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#3d6d96" />
      <stop offset="60%" stop-color="#234566" />
      <stop offset="100%" stop-color="#142638" />
    </radialGradient>
    
    <linearGradient id="silverMetallic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#e2e8f0" />
      <stop offset="50%" stop-color="#cbd5e1" />
      <stop offset="75%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>

    <linearGradient id="silverBright" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>

    <filter id="javaShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0a1520" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#javaBgGlow)" />
  
  <!-- Subtle Vignette / Border line -->
  <rect width="800" height="450" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="2" />

  <!-- JAVA COFFEE CUP EMBLEM -->
  <g filter="url(#javaShadow)" transform="translate(400, 160)">
    <!-- Steam Vapor 1 (Center High Swirl) -->
    <path d="M 5 -30 C -15 -65 15 -100 -5 -135 C -8 -138 2 -135 6 -130 C 26 -95 -8 -60 12 -28 C 10 -27 7 -28 5 -30 Z" 
          fill="url(#silverMetallic)" />
          
    <!-- Steam Vapor 2 (Right Steam Arc) -->
    <path d="M 28 -20 C 38 -55 58 -80 40 -115 C 38 -118 45 -115 48 -110 C 68 -75 48 -48 35 -18 C 32 -18 30 -19 28 -20 Z" 
          fill="url(#silverMetallic)" />

    <!-- Steam Vapor 3 (Left Small Wisps) -->
    <path d="M -15 -18 C -30 -40 -18 -65 -32 -90 C -34 -92 -28 -90 -24 -85 C -12 -65 -20 -45 -8 -17 C -10 -17 -13 -17 -15 -18 Z" 
          fill="url(#silverMetallic)" />

    <!-- Cup Rim / Upper Swoosh -->
    <path d="M -85 -10 C -45 5 45 5 85 -10 C 95 -14 98 -4 88 0 C 45 18 -45 18 -88 0 C -98 -4 -95 -14 -85 -10 Z" 
          fill="url(#silverMetallic)" />

    <!-- Handle (Right Ear) -->
    <path d="M 50 5 C 85 10 105 35 75 60 C 65 68 55 60 45 52 C 70 52 82 30 52 20 Z" 
          fill="url(#silverMetallic)" />

    <!-- Cup Middle Tier 1 (Ribbon curve) -->
    <path d="M -70 12 C -35 28 35 28 70 12 C 78 8 82 16 72 20 C 35 36 -35 36 -72 20 C -82 16 -78 8 -70 12 Z" 
          fill="url(#silverMetallic)" />

    <!-- Cup Middle Tier 2 (Narrower curve) -->
    <path d="M -60 32 C -30 46 30 46 60 32 C 68 28 70 35 62 39 C 30 53 -30 53 -62 39 C -70 35 -68 28 -60 32 Z" 
          fill="url(#silverMetallic)" />

    <!-- Saucer Upper Ring -->
    <path d="M -75 52 C -38 68 38 68 75 52 C 85 48 88 56 78 60 C 38 76 -38 76 -78 60 C -88 56 -85 48 -75 52 Z" 
          fill="url(#silverBright)" />

    <!-- Saucer Base Plate (Wide Bottom Swoosh) -->
    <path d="M -95 72 C -45 92 45 92 95 72 C 108 67 110 77 98 82 C 45 102 -45 102 -98 82 C -110 77 -108 67 -95 72 Z" 
          fill="url(#silverBright)" />
  </g>

  <!-- "Java" Typography -->
  <g filter="url(#javaShadow)" transform="translate(400, 360)">
    <text x="0" y="0" 
          text-anchor="middle" 
          font-family="'Times New Roman', Times, 'Cinzel', serif" 
          font-size="96" 
          font-weight="600" 
          letter-spacing="2"
          fill="url(#silverBright)">Java</text>
  </g>
</svg>
