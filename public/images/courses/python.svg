<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="pythonCanvasBg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </radialGradient>

    <!-- Hexagon Split Clip Paths & Gradients -->
    <linearGradient id="pyBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#389fd6" />
      <stop offset="100%" stop-color="#1f71a7" />
    </linearGradient>

    <linearGradient id="pyYellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd534" />
      <stop offset="100%" stop-color="#f39c12" />
    </linearGradient>

    <!-- Badge Drop Shadow -->
    <filter id="hexDropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.45" />
    </filter>
    
    <filter id="innerDarkShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3" />
    </filter>

    <!-- Hexagon Mask -->
    <clipPath id="hexClip">
      <polygon points="200,30 340,110 340,270 200,350 60,270 60,110" />
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#pythonCanvasBg)" />
  
  <!-- Subtle Ambient Tech Circuit Glow -->
  <circle cx="400" cy="225" r="180" fill="#389fd6" opacity="0.12" filter="blur(40px)" />
  <circle cx="440" cy="245" r="160" fill="#ffd534" opacity="0.08" filter="blur(40px)" />

  <!-- MAIN HEXAGON STICKER BADGE (Centered at 400, 225) -->
  <g transform="translate(200, 35)" filter="url(#hexDropShadow)">
    
    <!-- Outer White Border Contour -->
    <polygon points="200,16 354,104 354,276 200,364 46,276 46,104" fill="#ffffff" />
    
    <!-- Subtle 3D Inner Stroke -->
    <polygon points="200,24 346,108 346,272 200,356 54,272 54,108" fill="#e2e8f0" />

    <!-- Clipped Color Split Background -->
    <g clip-path="url(#hexClip)">
      <!-- Top-Left Cyan/Blue Half -->
      <polygon points="200,30 340,110 340,270 200,350 60,270 60,110" fill="url(#pyBlue)" />
      
      <!-- Diagonal Yellow Split -->
      <polygon points="340,110 340,270 200,350 60,270 240,110" fill="url(#pyYellow)" />
      
      <!-- Hex Facet Accent Highlight -->
      <polygon points="200,30 340,110 200,190" fill="#ffffff" opacity="0.1" />
    </g>

    <!-- CENTER PYTHON SNAKE EMBLEM (Dark Charcoal / Graphite finish) -->
    <g filter="url(#innerDarkShadow)" transform="translate(115, 75)">
      <!-- Top / Left Snake -->
      <path d="M 85 20 C 50 20 52 35 52 35 L 52 50 L 87 50 L 87 55 L 36 55 C 36 55 20 53 20 88 C 20 122 34 120 34 120 L 44 120 L 44 105 C 44 105 43 87 61 87 L 96 87 C 96 87 113 88 113 72 L 113 36 C 113 36 114 20 85 20 Z" 
            fill="#1e242b" />
      <!-- Top Snake Eye (Cyan) -->
      <circle cx="64" cy="33" r="4.5" fill="#389fd6" />
      <!-- Top Snake Mid-line Accent -->
      <path d="M 52 50 L 87 50" stroke="#389fd6" stroke-width="2.5" stroke-linecap="round" />

      <!-- Bottom / Right Snake -->
      <path d="M 85 150 C 120 150 118 135 118 135 L 118 120 L 83 120 L 83 115 L 134 115 C 134 115 150 117 150 82 C 150 48 136 50 136 50 L 126 50 L 126 65 C 126 65 127 83 109 83 L 74 83 C 74 83 57 82 57 98 L 57 134 C 57 134 56 150 85 150 Z" 
            fill="#1e242b" />
      <!-- Bottom Snake Eye (Yellow) -->
      <circle cx="106" cy="137" r="4.5" fill="#ffd534" />
      <!-- Bottom Snake Mid-line Accent -->
      <path d="M 83 120 L 118 120" stroke="#ffd534" stroke-width="2.5" stroke-linecap="round" />
    </g>

    <!-- "PYTHON" TYPOGRAPHY (Inside Yellow Section) -->
    <text x="200" y="308" 
          text-anchor="middle" 
          font-family="'Arial Black', Impact, 'Segoe UI Black', sans-serif" 
          font-size="34" 
          font-weight="900" 
          letter-spacing="2.5" 
          fill="#1b232a">PYTHON</text>
  </g>
</svg>
