<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <radialGradient id="csBg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="60%" stop-color="#0B0F17" />
      <stop offset="100%" stop-color="#030712" />
    </radialGradient>
    <linearGradient id="codeBrackets" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <filter id="csGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#3B82F6" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#csBg)" />

  <!-- Code / Algorithm Matrix backdrop -->
  <g opacity="0.08" stroke="#38BDF8" stroke-width="1">
    <circle cx="400" cy="225" r="190" fill="none" stroke-dasharray="12, 16" />
    <circle cx="400" cy="225" r="130" fill="none" stroke-dasharray="6, 8" />
  </g>

  <!-- Binary / Hex subtle floaters -->
  <g fill="#94A3B8" opacity="0.12" font-family="monospace" font-size="14" font-weight="bold">
    <text x="140" y="140">01000001</text>
    <text x="600" y="140">O(log n)</text>
    <text x="140" y="320">struct node*</text>
    <text x="600" y="320">01111000</text>
  </g>

  <!-- Central Algorithmic Visual: Glowing Code Nodes & Hex Shield -->
  <g filter="url(#csGlow)" transform="translate(400, 225)">
    <!-- Central Hexagon -->
    <polygon points="0,-75 65,-37 65,37 0,75 -65,37 -65,-37" fill="#1E293B" stroke="url(#codeBrackets)" stroke-width="2.5" />
    
    <!-- Code Symbols: < / > -->
    <path d="M -32,-16 L -48,0 L -32,16" fill="none" stroke="#38BDF8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 32,-16 L 48,0 L 32,16" fill="none" stroke="#10B981" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    <line x1="-10" y1="20" x2="10" y2="-20" stroke="#F59E0B" stroke-width="3.5" stroke-linecap="round" />

    <!-- Tree Branches & Algorithm Nodes -->
    <!-- Top Branch -->
    <line x1="0" y1="-75" x2="0" y2="-120" stroke="#3B82F6" stroke-width="2" stroke-dasharray="4, 4" />
    <circle cx="0" cy="-120" r="10" fill="#3B82F6" />
    <circle cx="0" cy="-120" r="4" fill="#FFFFFF" />

    <!-- Left Child Branch -->
    <line x1="-65" y1="37" x2="-130" y2="85" stroke="#38BDF8" stroke-width="2" stroke-dasharray="4, 4" />
    <circle cx="-130" cy="85" r="10" fill="#0284C7" />
    <circle cx="-130" cy="85" r="4" fill="#38BDF8" />

    <!-- Right Child Branch -->
    <line x1="65" y1="37" x2="130" y2="85" stroke="#10B981" stroke-width="2" stroke-dasharray="4, 4" />
    <circle cx="130" cy="85" r="10" fill="#059669" />
    <circle cx="130" cy="85" r="4" fill="#6EE7B7" />
  </g>
</svg>
