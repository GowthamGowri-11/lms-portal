<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <radialGradient id="aiBg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#141E33" />
      <stop offset="50%" stop-color="#0B1120" />
      <stop offset="100%" stop-color="#050811" />
    </radialGradient>
    <radialGradient id="aiGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#818CF8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="aiLine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0.7" />
    </linearGradient>
    <filter id="aiFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="450" fill="url(#aiBg)" />
  
  <!-- Subtle Matrix Grid -->
  <g opacity="0.08" stroke="#94A3B8" stroke-width="1">
    <line x1="0" y1="90" x2="800" y2="90" />
    <line x1="0" y1="180" x2="800" y2="180" />
    <line x1="0" y1="270" x2="800" y2="270" />
    <line x1="0" y1="360" x2="800" y2="360" />
    <line x1="160" y1="0" x2="160" y2="450" />
    <line x1="320" y1="0" x2="320" y2="450" />
    <line x1="480" y1="0" x2="480" y2="450" />
    <line x1="640" y1="0" x2="640" y2="450" />
  </g>

  <!-- Center Ambient Glow -->
  <circle cx="400" cy="225" r="220" fill="url(#aiGlow)" />

  <!-- Neural Network Geometric Core -->
  <g filter="url(#aiFilter)">
    <!-- Connections -->
    <path d="M 280 225 L 340 160 L 460 160 L 520 225 L 460 290 L 340 290 Z" fill="none" stroke="url(#aiLine)" stroke-width="2" opacity="0.6" />
    <path d="M 340 160 L 400 225 L 460 160" fill="none" stroke="url(#aiLine)" stroke-width="2" opacity="0.7" />
    <path d="M 340 290 L 400 225 L 460 290" fill="none" stroke="url(#aiLine)" stroke-width="2" opacity="0.7" />
    <line x1="280" y1="225" x2="400" y2="225" stroke="#38BDF8" stroke-width="2.5" opacity="0.8" />
    <line x1="400" y1="225" x2="520" y2="225" stroke="#A855F7" stroke-width="2.5" opacity="0.8" />
    
    <!-- Outer Synaptic Rings -->
    <circle cx="400" cy="225" r="110" fill="none" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="6, 8" opacity="0.4" />
    <circle cx="400" cy="225" r="145" fill="none" stroke="#C084FC" stroke-width="1" stroke-dasharray="4, 12" opacity="0.3" />

    <!-- Neural Nodes -->
    <circle cx="400" cy="225" r="16" fill="#38BDF8" />
    <circle cx="400" cy="225" r="24" fill="none" stroke="#38BDF8" stroke-width="2" opacity="0.6" />
    
    <circle cx="340" cy="160" r="10" fill="#60A5FA" />
    <circle cx="460" cy="160" r="10" fill="#818CF8" />
    <circle cx="520" cy="225" r="12" fill="#C084FC" />
    <circle cx="460" cy="290" r="10" fill="#E879F9" />
    <circle cx="340" cy="290" r="10" fill="#38BDF8" />
    <circle cx="280" cy="225" r="12" fill="#22D3EE" />

    <!-- Satellite Data Pulses -->
    <circle cx="220" cy="150" r="5" fill="#38BDF8" opacity="0.7" />
    <circle cx="580" cy="150" r="5" fill="#A855F7" opacity="0.7" />
    <circle cx="210" cy="290" r="5" fill="#22D3EE" opacity="0.7" />
    <circle cx="590" cy="290" r="5" fill="#E879F9" opacity="0.7" />
    <line x1="220" y1="150" x2="280" y2="225" stroke="#38BDF8" stroke-width="1" stroke-dasharray="3, 3" opacity="0.4" />
    <line x1="580" y1="150" x2="520" y2="225" stroke="#A855F7" stroke-width="1" stroke-dasharray="3, 3" opacity="0.4" />
    <line x1="210" y1="290" x2="280" y2="225" stroke="#22D3EE" stroke-width="1" stroke-dasharray="3, 3" opacity="0.4" />
    <line x1="590" y1="290" x2="520" y2="225" stroke="#E879F9" stroke-width="1" stroke-dasharray="3, 3" opacity="0.4" />
  </g>
</svg>
