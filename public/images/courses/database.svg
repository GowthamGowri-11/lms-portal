<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <radialGradient id="dbBg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="60%" stop-color="#090E1A" />
      <stop offset="100%" stop-color="#030712" />
    </radialGradient>
    <linearGradient id="cylinderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="cylinderTop" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#60A5FA" />
    </linearGradient>
    <linearGradient id="ringAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <filter id="dbGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#2563EB" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#dbBg)" />

  <!-- Grid Perspective Accent -->
  <g opacity="0.06" stroke="#60A5FA" stroke-width="1.2">
    <circle cx="400" cy="225" r="260" fill="none" stroke-dasharray="8, 12" />
    <circle cx="400" cy="225" r="180" fill="none" />
    <line x1="140" y1="225" x2="660" y2="225" stroke-dasharray="4, 4" />
    <line x1="400" y1="60" x2="400" y2="390" stroke-dasharray="4, 4" />
  </g>

  <!-- Central Database Cluster -->
  <g filter="url(#dbGlow)" transform="translate(400, 225)">
    <!-- Base tier 3 -->
    <g transform="translate(0, 60)">
      <path d="M -90,0 C -90,26 90,26 90,0 L 90,40 C 90,66 -90,66 -90,40 Z" fill="url(#cylinderGrad)" />
      <ellipse cx="0" cy="0" rx="90" ry="24" fill="url(#cylinderTop)" opacity="0.6" />
      <!-- Indicator LED -->
      <circle cx="70" cy="26" r="3" fill="#10B981" />
      <circle cx="56" cy="28" r="3" fill="#38BDF8" />
    </g>

    <!-- Mid tier 2 -->
    <g transform="translate(0, 0)">
      <path d="M -90,0 C -90,26 90,26 90,0 L 90,40 C 90,66 -90,66 -90,40 Z" fill="url(#cylinderGrad)" />
      <ellipse cx="0" cy="0" rx="90" ry="24" fill="url(#cylinderTop)" opacity="0.8" />
      <!-- Indicator LED -->
      <circle cx="70" cy="26" r="3" fill="#10B981" />
      <circle cx="56" cy="28" r="3" fill="#38BDF8" />
    </g>

    <!-- Top tier 1 -->
    <g transform="translate(0, -60)">
      <path d="M -90,0 C -90,26 90,26 90,0 L 90,40 C 90,66 -90,66 -90,40 Z" fill="url(#cylinderGrad)" />
      <ellipse cx="0" cy="0" rx="90" ry="24" fill="url(#cylinderTop)" />
      <!-- Inner rim highlight -->
      <ellipse cx="0" cy="0" rx="76" ry="18" fill="none" stroke="#FFFFFF" stroke-width="1.5" opacity="0.4" />
      <circle cx="70" cy="26" r="3" fill="#10B981" />
      <circle cx="56" cy="28" r="3" fill="#38BDF8" />
    </g>

    <!-- Side Data Nodes -->
    <g opacity="0.85">
      <circle cx="-160" cy="-20" r="14" fill="#1E293B" stroke="#06B6D4" stroke-width="2" />
      <circle cx="-160" cy="-20" r="5" fill="#06B6D4" />
      <path d="M -146,-20 L -90, -10" stroke="#06B6D4" stroke-width="2" stroke-dasharray="4, 4" />

      <circle cx="160" cy="-20" r="14" fill="#1E293B" stroke="#3B82F6" stroke-width="2" />
      <circle cx="160" cy="-20" r="5" fill="#3B82F6" />
      <path d="M 146,-20 L 90, -10" stroke="#3B82F6" stroke-width="2" stroke-dasharray="4, 4" />

      <circle cx="-130" cy="50" r="10" fill="#1E293B" stroke="#60A5FA" stroke-width="1.5" />
      <path d="M -120,50 L -90, 40" stroke="#60A5FA" stroke-width="1.5" stroke-dasharray="3, 3" />

      <circle cx="130" cy="50" r="10" fill="#1E293B" stroke="#10B981" stroke-width="1.5" />
      <path d="M 120,50 L 90, 40" stroke="#10B981" stroke-width="1.5" stroke-dasharray="3, 3" />
    </g>
  </g>
</svg>
